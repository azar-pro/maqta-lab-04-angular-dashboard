name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: xvfb-run -a npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: rivet-production
          path: dist/rivetworkspace/browser
          if-no-files-found: error

      - name: Install browser QA driver
        run: npm install --no-save puppeteer-core@latest

      - name: Run browser QA
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist/rivetworkspace/browser >/tmp/rivet-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME_BIN=/usr/bin/google-chrome QA_BASE_URL=http://127.0.0.1:4173/ node .github/scripts/browser-qa.mjs

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rivet-browser-qa
          path: qa
          if-no-files-found: warn

      - name: Publish production bundle to dist branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cp -R dist/rivetworkspace/browser /tmp/rivet-dist
          cp qa/screenshots/02-overview-desktop.png /tmp/rivet-dist/portfolio-preview.png
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git switch --orphan dist
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/rivet-dist/. .
          git add -A
          git commit -m "build: publish ${GITHUB_SHA}"
          git push --force origin dist
