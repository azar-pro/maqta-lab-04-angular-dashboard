name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: xvfb-run -a npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: rivet-production
          path: dist/rivetworkspace/browser
          if-no-files-found: error

      - name: Publish production bundle to dist branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cp -R dist/rivetworkspace/browser /tmp/rivet-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan dist
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/rivet-dist/. .
          git add -A
          git commit -m "build: publish ${GITHUB_SHA}"
          git push --force origin dist
